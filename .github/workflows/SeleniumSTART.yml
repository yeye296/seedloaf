name: Run Selenium Script (Start)

on:
  workflow_dispatch:
    inputs:
      use_session_cache:
        description: "Use session cache"
        required: false
        default: "true"
      start_or_stop:
        description: "start or stop"
        required: false
        default: "true"

jobs:
  run-selenium:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install Dependencies
        run: pip install -r .github/workflows/requirements.txt

      - name: Install jq
        run: sudo apt-get install -y jq unzip

      - name: Cache Chrome and ChromeDriver
        id: chrome-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/chrome
            /usr/local/bin/chromedriver
          key: chrome-cache-v1

      - name: Check Chrome and Chrome driver
        if: steps.chrome-cache.outputs.cache-hit != 'true'
        id: install-chrome
        run: |
          # Get Latest Stable Chrome Version
          LATEST_VERSION=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -r '.channels.Stable.version')
          echo "chrome_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Latest Chrome version: $LATEST_VERSION"

          # Intall Chrome and Chrome driver
          CHROME_URL="https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${LATEST_VERSION}/linux64/chrome-linux64.zip"
          wget "$CHROME_URL" -O chrome.zip
          unzip -q chrome.zip
          sudo mv chrome-linux64 /opt/chrome
          sudo chmod +x /opt/chrome/chrome
          sudo ln -sf /opt/chrome/chrome /usr/bin/google-chrome

          # Install ChromeDriver to /usr/local/bin
          DRIVER_URL="https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${LATEST_VERSION}/linux64/chromedriver-linux64.zip"
          wget "$DRIVER_URL" -O chromedriver.zip
          unzip -q chromedriver.zip
          chmod +x chromedriver-linux64/chromedriver
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver

      - name: Debug Secrets
        env:
          USERNAME: ${{ secrets.USERNAME }}
        run: echo "USERNAME is $USERNAME"

      - name: Restore Session Cache
        if: ${{ inputs.use_session_cache == 'true' }}
        id: restore-session
        uses: actions/cache/restore@v4
        with:
          path: /tmp/seedloaf-session
          key: seedloaf-session-cache-${{ github.run_id }}
          restore-keys: |
            seedloaf-session-cache-

      - name: 🔍 curl 直接测试 StartSession
        if: ${{ inputs.start_or_stop == 'true' }}
        env:
          SEEDLOAF_ACCOUNT: ${{ secrets.SEEDLOAF_ACCOUNT }}
          EMAIL: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
        run: |
          # EMAIL=$(echo "$SEEDLOAF_ACCOUNT" | cut -d',' -f2)
          # PASSWORD=$(echo "$SEEDLOAF_ACCOUNT" | cut -d',' -f3)
          echo "📡 登录获取 token..."
          LOGIN=$(curl -s -X POST \
            'https://clerk.seedloaf.com/v1/client/sign_ins?__clerk_api_version=2025-11-10' \
            -H 'content-type: application/x-www-form-urlencoded' \
            -H 'origin: https://seedloaf.com' \
            -c /tmp/clerk_cookies.txt \
            --data-urlencode "identifier=$EMAIL" \
            --data-urlencode "password=$PASSWORD")
          SESSION_ID=$(echo "$LOGIN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['response']['created_session_id'])")
          echo "✅ Session ID: ${SESSION_ID:0:20}..."
          echo "📡 Touch 获取 token..."
          TOUCH=$(curl -s -X POST \
            "https://clerk.seedloaf.com/v1/client/sessions/${SESSION_ID}/touch?__clerk_api_version=2025-11-10" \
            -H 'content-type: application/x-www-form-urlencoded' \
            -H 'origin: https://seedloaf.com' \
            -b /tmp/clerk_cookies.txt \
            -d 'active_organization_id=&intent=focus')
          TOKEN=$(echo "$TOUCH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['response']['last_active_token']['jwt'])")
          echo "✅ Token 长度: ${#TOKEN}"
          echo "📡 调用 StartSession..."
          curl -s -X POST \
            'https://api.seedloaf.com/connect/worlds.v1.SessionService/StartSession' \
            -H "authorization: Bearer $TOKEN" \
            -H 'connect-protocol-version: 1' \
            -H 'content-type: application/json' \
            -d "{\"id\":\"$SERVER_ID\"}" \
            -w "\nHTTP状态: %{http_code}\n"

      - name: Run Selenium Start Script
        if: ${{ inputs.start_or_stop == 'true' }}
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python .github/workflows/websitebotex.py

      - name: Run Selenium Stop Script
        if: ${{ inputs.start_or_stop == 'false' }}
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python .github/workflows/websitebotstop.py

      - name: Check for new session
        if: ${{ inputs.use_session_cache == 'true' }}
        id: session-check
        run: |
          if [ -f /tmp/seedloaf-session/.valid_session ]; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Save session cache
        if: ${{ inputs.use_session_cache == 'true' && steps.session-check.outputs.valid == 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/seedloaf-session
          key: seedloaf-session-cache-${{ github.run_number }}

      # --- 新增的防暂停代码开始 ---
      - name: Commit time.txt to repo
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 如果 time.txt 不存在，说明是第一次运行
          if [ ! -f time.txt ]; then
            echo "首次生成时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          else
            echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          fi
          
          git add time.txt
          
          # 如果有更改再提交
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            # 显式携带 Token 推送
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          fi
      # --- 新增的防暂停代码结束 ---
